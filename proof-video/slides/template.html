<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../assets/fonts/InterVariable.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Plex; src: url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Plex; src: url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: Plex; src: url(../assets/fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
:root { --bg: #0B0B0C; --fg: #ECECEA; --dim: #6E6E6C; --mid: #9A9A97; --acc: #4B3BFF; --acc2: #8F86FF; --ok: #3DDC97; --paper: #D9D9D6; --ink: #121212; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: Plex, monospace; color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas.full { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: screen; background-size: 960px 540px; z-index: 50; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55)); z-index: 49; }
#stage { position: absolute; inset: 0; padding: 150px 170px 240px; display: flex; flex-direction: column; justify-content: center; transform-origin: 50% 42%; z-index: 2; }
#frame { position: absolute; left: 110px; right: 110px; top: 70px; bottom: 200px; z-index: 1; pointer-events: none; }
#frame .rule { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: #2A2A2A; }
#frame i { position: absolute; width: 4px; height: 4px; background: #5A5A5A; border-radius: 50%; }
#hdr { position: absolute; top: 92px; left: 170px; font-size: 24px; color: var(--dim); letter-spacing: .02em; z-index: 3; }
#hdr b { color: var(--mid); font-weight: 400; margin-right: 26px; }
/* session rows */
.line { display: flex; align-items: baseline; gap: 34px; font-size: 38px; margin: 10px 0; white-space: nowrap; }
.pfx { width: 52px; color: var(--mid); }
.pfx.acc { color: var(--acc2); }
.lb { display: inline-block; min-width: 190px; text-align: center; padding: 0 18px; background: var(--fg); color: var(--ink); line-height: 1.25; }
.lb.acc { background: var(--acc); color: #fff; }
.say { color: var(--fg); }
.say.dim { color: var(--mid); }
.tree { margin-top: 44px; }
.trow { display: grid; grid-template-columns: 70px 50px 330px 1fr auto; align-items: baseline; font-size: 35px; height: 64px; white-space: nowrap; }
.trow .br { color: #5A5A5A; }
.trow .st { color: var(--ok); }
.trow .k { color: var(--fg); }
.trow .m { color: var(--dim); }
.trow .v { color: var(--fg); text-align: right; }
.trow.sub .k { padding-left: 0; color: var(--mid); }
.vbox { background: var(--fg); color: var(--ink); padding: 0 14px; }
.vbox.acc { background: var(--acc); color: #fff; }
.tag { display: inline-block; border: 1.5px solid #3A3A3A; padding: 2px 16px; margin-left: 12px; color: var(--mid); font-size: 30px; }
.tag.on { border-color: var(--acc2); color: #fff; background: rgba(75,59,255,.25); }
/* paper cards */
.paper { background: var(--paper); color: var(--ink); padding: 34px 44px 40px; position: relative; box-shadow: 0 40px 120px rgba(0,0,0,.6); }
.paper .ph { display: flex; justify-content: space-between; font-size: 24px; color: #6A6A68; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1.5px solid #A9A9A6; padding-bottom: 18px; margin-bottom: 26px; }
.paper .ph b { color: var(--ink); font-weight: 600; text-transform: none; letter-spacing: 0; font-family: Inter; font-size: 26px; }
.paper .title { font-family: Inter; font-size: 58px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; }
.paper .sub { font-family: Inter; font-size: 28px; color: #5E5E5C; margin-top: 10px; letter-spacing: -0.01em; }
.paper .big { font-family: Inter; font-size: 120px; font-weight: 400; letter-spacing: -0.05em; line-height: 1; }
.paper .prow { display: grid; grid-template-columns: 40px 330px 1fr auto; font-size: 28px; padding: 9px 0; align-items: baseline; }
.paper .prow .sq { width: 14px; height: 14px; background: var(--acc); display: inline-block; }
.paper .prow .m { color: #6A6A68; }
.paper .chip { display: inline-block; font-size: 24px; border: 1.5px solid #8E8E8B; border-radius: 999px; padding: 4px 18px; margin: 14px 10px 0 0; color: #333; }
.paper .chip.ink { background: var(--ink); color: #fff; border-color: var(--ink); }
.paper .chip.acc { background: var(--acc); color: #fff; border-color: var(--acc); }
.headline { font-family: Inter; font-size: 76px; font-weight: 500; letter-spacing: -0.04em; text-align: center; }
.center { position: absolute; left: 0; right: 0; text-align: center; }
.caret { display: inline-block; width: .55em; height: 1.05em; background: var(--fg); vertical-align: -0.18em; margin-left: 4px; }
.mono-s { font-size: 26px; color: var(--dim); }
.arrowline { position: relative; height: 2px; background: repeating-linear-gradient(90deg, #4A4A4A 0 10px, transparent 10px 18px); }
.pkt { position: absolute; top: -6px; width: 14px; height: 14px; background: var(--acc2); box-shadow: 0 0 18px var(--acc); }
.node { border: 1.5px solid #3A3A3A; padding: 22px 20px; font-size: 32px; text-align: center; background: #111; }
.node .n2 { font-size: 23px; color: var(--dim); margin-top: 8px; }
.node.on { border-color: var(--acc2); background: #19163A; }
</style>
</head>
<body>
<canvas id="fx" class="full" width="1920" height="1080"></canvas>
<div id="frame"><div class="rule"></div><i style="left:-2px;top:-2px"></i><i style="right:0;top:-2px"></i><i style="left:-2px;bottom:-2px"></i><i style="right:0;bottom:-2px"></i><i style="right:14px;bottom:-2px"></i></div>
<div id="hdr"></div>
<div id="stage"></div>
<div id="vignette"></div>
<div id="grain"></div>
<script>
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(1 - p, 3);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const SPIN = ['⣾','⣽','⣻','⢿','⡿','⣟','⣯','⣷'];
let S = null, FX = null;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// grain tiles
const grains = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement('canvas'); c.width = 960; c.height = 540;
  const x = c.getContext('2d'); const d = x.createImageData(960, 540); const r = rng(k * 7919 + 3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  x.putImageData(d, 0, 0); grains.push(c.toDataURL('image/png'));
}
const T = (k) => { const v = S.times[k]; if (v === undefined) throw new Error('unresolved phrase: ' + k); return v; };
window.setup = (scene, meta) => {
  S = meta;
  document.getElementById('stage').innerHTML = scene.html;
  document.getElementById('hdr').innerHTML = scene.hdr ? `<b>⌄</b>${scene.hdr}` : '';
  document.getElementById('frame').style.display = scene.noFrame ? 'none' : 'block';
  FX = scene.fx || null;
  for (const el of document.querySelectorAll('[data-at],[data-t]')) el._in = el.dataset.t !== undefined ? +el.dataset.t : T(el.dataset.at);
  for (const el of document.querySelectorAll('[data-done]')) el._done = T(el.dataset.done);
  for (const el of document.querySelectorAll('[data-on]')) el._on = el.dataset.on.split('|').map(T);
  for (const el of document.querySelectorAll('[data-out]')) el._out = T(el.dataset.out);
  for (const el of document.querySelectorAll('[data-type]')) el._text = el.dataset.type;
  if (FX && FX.tokens) {
    const r = rng(FX.seed || 42);
    FX.items = Array.from({ length: FX.count || 60 }, (_, i) => ({
      x: r() * 1920, y: 120 + r() * 800, vx: (r() - .5) * 14, vy: (r() - .5) * 8,
      txt: r() < .45 ? FX.glyphs[Math.floor(r() * FX.glyphs.length)] : FX.tokens[Math.floor(r() * FX.tokens.length)],
      ph: r() * 6, per: 4 + r() * 5, acc: r() < .18, size: 20 + Math.floor(r() * 12)
    })).filter(it => !(Math.abs(it.x - 960) < 560 && Math.abs(it.y - 470) < 120));
  }
  return true;
};
function drawFx(t, g) {
  const c = document.getElementById('fx'), x = c.getContext('2d');
  x.clearRect(0, 0, 1920, 1080);
  if (!FX) return;
  const a0 = FX.from !== undefined ? clamp((t - FX.from) / 0.8, 0, 1) : 1;
  const a1 = FX.until !== undefined ? 1 - clamp((t - S.times[FX.until]) / 0.8, 0, 1) : 1;
  const A = a0 * a1;
  if (FX.tokens) {
    x.textBaseline = 'middle';
    for (const it of FX.items) {
      const life = ((t + it.ph) % it.per) / it.per;
      const al = Math.sin(Math.PI * life) * A;
      x.globalAlpha = al * (it.acc ? .95 : .6);
      x.fillStyle = it.acc ? '#7C70FF' : (it.size > 27 ? '#DADAD7' : '#8A8A87');
      x.font = `${it.size}px Plex`;
      x.fillText(it.txt, it.x + it.vx * t, it.y + it.vy * t);
    }
    x.globalAlpha = 1;
  }
  if (FX.strands) {
    x.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 7; k++) {
      const ph = k * 1.7, w = 1.2 + (k % 3);
      x.beginPath();
      const sx = 300 + k * 230 + Math.sin(g * .25 + ph) * 120;
      x.moveTo(sx, 1100);
      x.bezierCurveTo(sx + Math.sin(g * .3 + ph) * 400, 700, 960 + Math.cos(g * .2 + ph) * 500, 300 + Math.sin(g * .35 + k) * 120, 900 + Math.sin(g * .15 + ph * 2) * 700, -40);
      const gr = x.createLinearGradient(0, 1100, 0, 0);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(235,235,235,${.32 * A})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.strokeStyle = gr; x.lineWidth = w; x.shadowColor = 'rgba(255,255,255,.6)'; x.shadowBlur = 24; x.stroke();
    }
    x.shadowBlur = 0; x.globalCompositeOperation = 'source-over';
  }
}
window.render = (t, frame) => {
  const g = S.globalStart + t;
  document.getElementById('grain').style.backgroundImage = `url(${grains[Math.floor(frame / 2) % grains.length]})`;
  drawFx(t, g);
  const stage = document.getElementById('stage');
  const fade = ease(clamp(t / 0.45, 0, 1)) * clamp((S.dur - t) / 0.35, 0, 1);
  for (const id of ['stage', 'hdr', 'frame', 'fx']) document.getElementById(id).style.opacity = fade;
  stage.style.transform = `scale(${1 + 0.018 * (t / S.dur)})`;
  for (const el of document.querySelectorAll('[data-at],[data-t]')) {
    const dur = el.dataset.anim === 'card' ? 0.75 : 0.45;
    let p = ease(clamp((t - el._in) / dur, 0, 1));
    if (el._out !== undefined) p *= 1 - ease(clamp((t - el._out) / 0.4, 0, 1));
    el.style.opacity = p;
    const k = el.dataset.anim || 'up';
    if (k === 'up') el.style.transform = `translateY(${(1 - p) * 16}px)`;
    else if (k === 'card') el.style.transform = `translateY(${(1 - p) * 70}px) scale(${0.97 + 0.03 * p})`;
    else if (k === 'left') el.style.transform = `translateX(${(1 - p) * -30}px)`;
  }
  // tree rows: spinner until done, then check; value dim -> bright
  for (const el of document.querySelectorAll('.trow')) {
    const st = el.querySelector('.st'); const v = el.querySelector('.v'); const done = el._done ?? (el._in + 0.9);
    if (st) st.textContent = t < el._in ? '' : t < done ? SPIN[Math.floor(t * 12) % 8] : '✓';
    if (st) st.style.color = t < done ? '#8A8A87' : '';
    if (v) v.style.opacity = t < done ? 0.32 : 1;
  }
  for (const el of document.querySelectorAll('[data-on]')) el.classList.toggle('on', el._on.some(h => t >= h));
  for (const el of document.querySelectorAll('[data-count]')) {
    const p = ease(clamp((t - el._in) / 1.6, 0, 1));
    el.textContent = (el.dataset.pre || '') + Math.round(p * +el.dataset.count).toLocaleString('en-US') + (el.dataset.suffix || '');
  }
  for (const el of document.querySelectorAll('[data-type]')) {
    const n = Math.floor(clamp((t - el._in) * (+el.dataset.cps || 30), 0, el._text.length));
    el.textContent = el._text.slice(0, n);
    const c = el.nextElementSibling;
    if (c && c.classList.contains('caret')) c.style.visibility = (t >= el._in && (n < el._text.length || (Math.floor(t * 2.2) % 2 === 0 && el.dataset.keep !== undefined && t < (el._done ?? 1e9)))) ? 'visible' : 'hidden';
  }
  for (const el of document.querySelectorAll('.pkt[data-path]')) {
    const pts = el.dataset.path.split('|').map(T); // times to hit each stop
    const stops = el.dataset.stops.split(',').map(Number);
    let x = stops[0];
    for (let i = 0; i < pts.length - 1; i++) if (t >= pts[i]) x = stops[i] + (stops[i + 1] - stops[i]) * ease(clamp((t - pts[i]) / 0.9, 0, 1));
    if (t >= pts[pts.length - 1]) x = stops[stops.length - 1];
    el.style.left = x + 'px'; el.style.opacity = t >= pts[0] ? 1 : 0;
  }
  for (const el of document.querySelectorAll('.flow')) {
    const t0 = T(el.dataset.from); const n = 5; let h = '';
    for (let i = 0; i < n; i++) { const p = ((t - t0) * 0.45 + i / n) % 1; if (t >= t0) h += `<span class="pkt" style="left:${p * 100}%; opacity:${Math.sin(Math.PI * p)}"></span>`; }
    el.innerHTML = h;
  }
  return true;
};
</script>
</body>
</html>
